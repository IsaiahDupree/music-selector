[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "music-selector"
version = "1.0.0"
description = "Zero-dependency background music recommendation engine for video content"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["music", "video", "remotion", "ffmpeg", "content-creation", "background-music"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Multimedia :: Sound/Audio",
]

[project.scripts]
music-select = "suggest:main"

[tool.setuptools]
py-modules = ["suggest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
